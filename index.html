<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2340C8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Album musée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Album du musée</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gochi+Hand&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Mur de musée clair : chaque catégorie est un cadre doré dont le pictogramme reste toujours visible.
   Un gros bouton photo en bas de l'écran ; on range la photo après l'avoir prise. */
:root{
  color-scheme:light;
  /* Papiers découpés : fond blanc, formes pleines cobalt / vermillon / jaune / vert, trait d'encre */
  --wall:#FFFFFF; --wall-2:#EEF1FB; --card:#FFFFFF; --ink:#14183A; --ink-soft:#4A5068;
  --gold:#2340C8; --gold-2:#F7C31C; --coral:#EE4B2B; --coral-2:#B8361D; --ok:#1F8A57; --line:#CDD3EA;
  --cobalt:#2340C8; --yellow:#F7C31C; --green:#1F8A57; --tint-y:#FFF3CC; --tint-b:#E3E8FA; --tint-g:#DDF1E6;
  --display:"Lilita One","Arial Rounded MT Bold",ui-rounded,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  -webkit-tap-highlight-color:transparent}
body.has-bar{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.note{color:var(--ink-soft);font-size:.92rem;margin:0}
.btn{background:var(--cobalt);color:#fff;font-weight:400;padding:12px 18px;border-radius:999px;font-family:var(--display);font-size:1.15rem;text-align:center;letter-spacing:.2px}
.btn.ghost{background:var(--card);color:var(--ink);border:2.5px solid var(--ink)}
.btn.coral{background:var(--coral)}
.btn.big{width:100%;padding:16px;font-size:1.35rem}
.btn.small{padding:8px 14px;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ink-soft);padding:8px 0}

/* étapes */
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 0;border-radius:999px;color:var(--ink-soft);background:var(--wall-2)}
.steps span.on{background:var(--ink);color:var(--wall)}
.steps span.done{background:var(--gold-2);color:var(--ink)}

/* étoiles */
.stars{background:var(--cobalt);color:#fff;border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.stars .grow{flex:1;min-width:0}
.starline{display:flex;gap:2px;flex-wrap:wrap;font-size:1.6rem;line-height:1}
.star{color:rgba(255,255,255,.28)}
.star.on{color:var(--yellow);text-shadow:none;display:inline-block;transform:rotate(-8deg)}
.star.on:nth-child(2n){transform:rotate(9deg)}
.bonus{font-size:2.8rem;line-height:1;color:rgba(255,255,255,.28);flex:none}
.bonus.on{color:var(--yellow);text-shadow:none}
.stars small{display:block;color:#fff;font-weight:700;font-size:.85rem;margin-top:4px}

/* cadres */
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.frame{background:var(--yellow);border-radius:26px 26px 26px 8px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;margin:4px}
.frame:nth-child(4n+2){background:var(--coral);border-radius:50% 50% 30% 30% / 34% 34% 22% 22%}
.frame:nth-child(4n+3){background:var(--cobalt);border-radius:8px 26px 26px 26px}
.frame:nth-child(4n){background:var(--green);border-radius:26px 8px 26px 26px}
.frame:nth-child(4n+1){transform:rotate(-1.2deg)}.frame:nth-child(4n+2){transform:rotate(1.4deg)}.frame:nth-child(4n+3){transform:rotate(1deg)}.frame:nth-child(4n){transform:rotate(-1deg)}
.frame .pic{aspect-ratio:1;border-radius:18px;background:var(--wall-2);display:grid;place-items:center;overflow:hidden;max-width:100%}
.frame:nth-child(4n+2) .pic{border-radius:46% 46% 22% 22% / 30% 30% 16% 16%}
.frame .pic img{width:100%;height:100%;object-fit:cover;display:block}
.frame.empty{background:var(--card);border:3px dashed var(--ink);transform:none}
.frame.empty .pic{background:var(--card)}
.frame .glyph{font-size:3.4rem;line-height:1;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--tint-y)}
.frame:nth-child(4n+2) .glyph{background:#FDE2DB}.frame:nth-child(4n+3) .glyph{background:var(--tint-b)}.frame:nth-child(4n) .glyph{background:var(--tint-g)}
.frame .chip{position:absolute;left:0;top:0;width:50px;height:50px;border-radius:50%;background:var(--card);border:3px solid var(--ink);
  display:grid;place-items:center;font-size:1.8rem;transform:translate(-22%,-22%)}
.frame .cartel{background:var(--card);border-radius:14px;padding:6px 9px 7px;display:flex;flex-direction:column;gap:1px;line-height:1.2;color:var(--ink)}
.frame.empty .cartel{padding:2px 4px}
.cartel .num{font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--coral-2)}
.cartel .nm{font-size:.88rem;font-weight:700}
.cartel .by{font-size:.74rem;color:var(--ink-soft)}
.frame .count{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border-radius:999px;min-width:30px;height:30px;
  display:grid;place-items:center;font-weight:700;font-size:.95rem;padding:0 7px}
.frame.pop{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08) rotate(-2deg)}70%{transform:scale(.98)}100%{transform:scale(1)}}

/* barre photo */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--wall) 60%,rgba(228,236,238,0))}
.shoot{display:flex;align-items:center;gap:12px;background:var(--coral);color:#fff;border-radius:999px;padding:12px 28px 12px 14px;
  font-family:var(--display);font-size:1.45rem;font-weight:800;box-shadow:0 6px 0 var(--coral-2),0 10px 20px rgba(0,0,0,.2);cursor:pointer;position:relative}
.shoot:active{transform:translateY(3px);box-shadow:0 3px 0 var(--coral-2)}
.shoot .lens{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.9rem}
.shoot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.clueimg{display:block;width:100%;max-height:60vh;object-fit:contain;background:var(--wall-2);border-radius:22px;border:8px solid var(--yellow);box-sizing:border-box}
.zoomed{position:fixed;inset:0;z-index:25;background:#111;display:flex;align-items:center;justify-content:center;overflow:auto}
.zoomed img{max-width:none;width:220%}
.speak{align-self:flex-start}
.famcard{position:relative;display:block;border-radius:18px;overflow:hidden;background:var(--card);border:2px solid var(--line)}
.famcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.famcard .famlabel{position:absolute;left:10px;bottom:10px;background:var(--card);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem}
.famcard .famchange{position:absolute;right:10px;bottom:10px;cursor:pointer;overflow:hidden}
.famcard.empty{border-style:dashed;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.famcard.empty .glyph{font-size:2.4rem}
.famcard input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* accueil */
.band{position:relative;overflow:hidden;background:var(--cobalt);color:#fff;margin:-14px calc(-1 * max(16px, env(safe-area-inset-right,0px))) -6px calc(-1 * max(16px, env(safe-area-inset-left,0px)));
  padding:30px max(20px, env(safe-area-inset-left,0px)) 44px}
.band p{margin:0;font-weight:700;font-size:.85rem;position:relative}
.band h1{font-size:2.9rem;line-height:.95;position:relative;margin-top:4px}
.band .blob1{position:absolute;right:-30px;top:-24px;width:170px;height:200px}
.band .blob2{position:absolute;right:110px;bottom:-30px;width:90px;height:90px}
.band + .visitcard{margin-top:-30px}
.visitcard{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--ink);position:relative}
.stamp{position:absolute;right:14px;top:14px;width:64px;height:64px;border-radius:50%;border:3px solid var(--coral);color:var(--coral-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:1.3rem;line-height:1;transform:rotate(-12deg)}
.stamp small{font-family:var(--body);font-size:.58rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.vthumb{width:76px;height:76px;border-radius:50% 50% 46% 54% / 56% 44% 56% 44%;object-fit:cover;flex:none;box-shadow:0 0 0 4px var(--yellow)}
span.vthumb{display:grid;place-items:center;font-size:2.4rem;background:var(--wall)}
.visitcard small.note{display:block}
.vstars{display:none}
.how{display:flex;flex-direction:column;gap:10px}
.howrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.howrow div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.howrow span{width:62px;height:62px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.7rem;background:var(--cobalt);border-radius:50%}
.howrow div:nth-child(2) span{background:var(--coral);border-radius:12px;transform:rotate(8deg)}
.howrow div:nth-child(3) span{background:var(--green);border-radius:62% 38% 55% 45% / 45% 55% 45% 55%}.howrow strong{font-size:.85rem}.howrow small{font-size:.72rem;color:var(--ink-soft);font-weight:700;line-height:1.2}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.modebtn{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:16px;border:2.5px solid var(--line);background:var(--card);line-height:1.15}
.modebtn small{font-size:.75rem;color:var(--ink-soft)}
.modebtn.on{border-color:var(--ink);background:var(--tint-y)}
/* albums et styles de PDF */
.frame.excluded{opacity:.32;filter:grayscale(1)}
.chipbtn.incl{padding:8px 14px 8px 8px;font-size:.85rem}
.chipbtn.incl .cbx{width:24px;height:24px;flex:none;border-radius:7px;border:2.5px solid var(--ink);display:inline-grid;place-items:center;font-size:.85rem;background:var(--card)}
.chipbtn.incl:not(.on){opacity:.6;text-decoration:line-through}
.albpick,.tplpick{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chipbtn{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);font-weight:700;text-align:left;line-height:1.1}
.chipbtn small{display:block;font-weight:400;font-size:.72rem;color:var(--ink-soft)}
.chipbtn.on{border-color:var(--ink);background:var(--tint-y)}
.chipbtn .av{color:#fff;font-family:var(--display)}
.frame .chg{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:.8rem;font-weight:700;text-align:center;padding:8px 6px;border-radius:16px;border:2.5px solid transparent;line-height:1.15}
.tpl.on{border-color:var(--ink);background:var(--wall-2)}
.tplprev{position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(20,24,58,.18)}
.tplprev i,.tplprev b{position:absolute;display:block}
.tpl-decoupe .tplprev{background:#fff}
.tpl-decoupe .tplprev i{left:0;right:0;top:0;height:46%;background:#2340C8}
.tpl-decoupe .tplprev b{left:20%;top:30%;width:60%;height:44%;background:linear-gradient(#8FA7B5,#8FA7B5) 50%/72% 72% no-repeat #F7C31C;border-radius:14px 14px 14px 4px;transform:rotate(-4deg)}
.tpl-cartel{font-family:"Libre Baskerville",Georgia,serif;font-weight:400}
.tpl-cartel .tplprev{background:#F1F1EE}
.tpl-cartel .tplprev i{left:16%;top:14%;width:68%;height:50%;background:linear-gradient(#8FA7B5,#8FA7B5) 50%/66% 64% no-repeat #fff;border:4px solid #1E1E1E;box-sizing:border-box}
.tpl-cartel .tplprev b{right:12%;bottom:13%;width:40%;height:12%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tpl-carnet{font-family:"Gochi Hand","Comic Sans MS",cursive;font-size:1rem;font-weight:400}
.tpl-carnet .tplprev{background:#fff radial-gradient(#C5CCC8 1px,transparent 1.4px) 0 0/9px 9px}
.tpl-carnet .tplprev i{left:16%;top:18%;width:68%;height:58%;background:linear-gradient(#8FA7B5,#8FA7B5) 50% 18%/82% 64% no-repeat #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(-5deg)}
.tpl-carnet .tplprev b{left:38%;top:12%;width:32%;height:9%;background:rgba(233,118,43,.5);transform:rotate(6deg)}
/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:var(--card);border-top:3px solid var(--ink);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;font-weight:800;color:var(--ink-soft);padding:4px 0;border-radius:12px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--cobalt)}
.shootbtn{justify-self:center;position:relative;width:72px;height:72px;margin-top:-30px;border-radius:50%;background:var(--coral);display:grid;place-items:center;
  border:3px solid var(--ink);box-shadow:0 0 0 4px var(--card);cursor:pointer}
.shootbtn:active{transform:translateY(3px)}
.shootbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* en-tête de l'album */
.hero{display:flex;gap:12px;align-items:center}
.hero .grow{flex:1;min-width:0}
.famchip{position:relative;width:76px;height:76px;flex:none;border-radius:16px;border:2px dashed var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;overflow:hidden;text-align:center;line-height:1.05}
.famchip span{font-size:1.6rem}.famchip small{font-size:.62rem;font-weight:800;color:var(--ink-soft)}
.famchip.has{border:3px solid var(--ink)}.famchip img{width:100%;height:100%;object-fit:cover}
.famchip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tip{margin:0;background:var(--card);border-radius:14px;padding:12px 14px;font-weight:700;border:2px solid var(--line)}
/* mode d'emploi */
.intro{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;gap:18px;text-align:center;align-items:center}
.intro .hero-ico{font-size:5rem;line-height:1}
.intro p{max-width:30ch;margin:0;font-size:1.05rem}
.dots{display:flex;gap:8px}.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--ink)}
/* catégorie */
.cat-head{display:flex;gap:14px;align-items:center}
.cat-head .glyph{font-size:3.4rem;line-height:1;width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;
  box-shadow:0 0 0 4px var(--yellow)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--wall-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .who{position:absolute;bottom:4px;left:4px}
.empty-state{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty-state .glyph{font-size:2.6rem}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-family:var(--display);
  font-size:1.2rem;flex:none;border:3px solid var(--card);line-height:1}
.av.lg{width:72px;height:72px;font-size:2.4rem;border-width:4px}
.av.xl{width:112px;height:112px;font-size:3.8rem;border-width:5px}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:.95rem;padding:8px;border-radius:16px;min-width:88px}
.pick:active{background:var(--wall-2)}

/* feuilles */
.sheet{position:fixed;inset:0;background:rgba(18,30,36,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet>div{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:560px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet img.full{width:100%;border-radius:12px;max-height:58vh;object-fit:contain;background:var(--wall-2)}
.sheet .preview{display:flex;gap:12px;align-items:center}
.sheet .preview img{width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none}
.sheetgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick.sel{background:var(--tint-y);box-shadow:0 0 0 3px var(--ink)}
.catpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.catpick button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--wall);border-radius:16px;padding:12px 8px;font-weight:800;font-size:.85rem;line-height:1.2;text-align:center}
.catpick button:active{background:var(--wall-2)}
.catpick .glyph{font-size:2.6rem;line-height:1}
.catpick .n{font-size:.75rem;color:var(--ink-soft)}
.emojis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.emojis button{font-size:1.9rem;aspect-ratio:1;border-radius:12px;background:var(--wall)}
.emojis button.sel{box-shadow:0 0 0 3px var(--gold)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:50%}
.swatches button.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}

/* vote */
.turn{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--card);border-radius:24px;padding:28px 18px;border:2px solid var(--line)}
.vote-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vote-card{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--wall-2);max-width:100%}
.vote-card img{width:100%;height:100%;object-fit:cover;display:block}
.vote-card .tally{position:absolute;right:6px;bottom:6px;left:6px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.vote-card.lead{box-shadow:0 0 0 5px var(--gold-2)}
.vote-card.lose{opacity:.45}
.vote-card .crown{position:absolute;top:6px;left:6px;font-size:2rem;font-weight:700;color:var(--ink);background:var(--yellow);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;line-height:1}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--wall-2);border-radius:18px;padding:12px 14px;text-align:left;width:100%}
.item .glyph{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.6rem;flex:none}
.item .glyph{font-size:2rem;line-height:1}
.item .grow{flex:1;min-width:0;font-weight:800}
.item .state{font-size:.82rem;color:var(--ink-soft);font-weight:800;text-align:right}
.item .state.ok{color:var(--ok)}
.item[disabled]{opacity:.5}

/* préparation */
.step{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--wall);display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.field{display:flex;gap:8px;align-items:center}
.field input[type=text]{flex:1;min-width:0;font:inherit;font-weight:700;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--wall);color:var(--ink)}
.icon-pick{width:52px;height:52px;border-radius:14px;background:var(--wall);border:2px solid var(--line);font-size:1.8rem;display:grid;place-items:center;flex:none}
.x{width:40px;height:40px;border-radius:50%;color:var(--ink-soft);font-size:1.1rem;flex:none;display:grid;place-items:center}
.x.warn{background:var(--coral);color:#fff;width:auto;padding:0 12px;border-radius:999px;font-size:.85rem;font-weight:800}
.check{display:flex;gap:12px;align-items:center;font-weight:700}
.check input{width:24px;height:24px;flex:none;accent-color:var(--gold)}
.podium{display:flex;flex-direction:column;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--wall);
  padding:10px 16px;border-radius:14px;font-weight:800;z-index:40;max-width:calc(100% - 32px);text-align:center}
body.has-bar #toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.frame.pop{animation:none}}
@media (min-width:600px){.wall{grid-template-columns:repeat(3,minmax(0,1fr))}.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}.catpick{grid-template-columns:repeat(3,minmax(0,1fr))}}

<script>
(function(){
const COLORS=['#2E6FB7','#D2473A','#2F8F5B','#8A4FBF','#D9822B','#1E8C93','#C2407A','#5C6B2E'];

    cats: (prev?prev.cats.map(c=>[c.icon,c.name]):DEFAULT_CATS).map(([i,n])=>({id:uid(),icon:i,name:n,photos:[],votes:{},winner:null})),
    celebrated:false, voteCelebrated:false, gallery: prev?prev.gallery!==false:true, voteMode: prev?(prev.voteMode||'rapide'):'rapide', setupDone: prev?!!prev.setupDone:false, archive: prev?(prev.archive||[]):[], familyPhoto:null, picks:{}, excl:{}, pdfTpl: prev?(prev.pdfTpl||'decoupe'):'decoupe', hunts: prev?(prev.hunts||{}):{}, onboarded: prev?!!prev.onboarded:false, keepAwake: prev?prev.keepAwake:true, lastBackup: prev?prev.lastBackup:null, backupCount: prev?prev.backupCount:0, lastHunt: prev?prev.lastHunt:null
  };
}
/* ---------- stockage (mêmes clés que la version précédente) ---------- */
let S;
try{S=JSON.parse(localStorage.getItem('albumMusee')||'null')}catch(e){S=null}
if(!S) S=freshState();
if(S.gallery===undefined) S.gallery=true;
if(!S.voteMode) S.voteMode='rapide';

if(S.setupDone===undefined) S.setupDone=S.cats.some(c=>c.photos.length);
S.family.forEach((m,i)=>{if(!m.icon)m.icon=ANIMALS[i%ANIMALS.length]});
function save(){try{localStorage.setItem('albumMusee',JSON.stringify(S))}catch(e){}}
let db=null; const mem=new Map(); const urls=new Map();
try{
  const r=indexedDB.open('albumMuseePhotos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('p');
  r.onsuccess=()=>{db=r.result;render()};
  r.onerror=()=>{db=null};
}catch(e){db=null}
function putBlob(id,blob){mem.set(id,blob);if(!db)return;try{db.transaction('p','readwrite').objectStore('p').put(blob,id)}catch(e){}}
function delBlob(id){mem.delete(id);if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}
  if(!db)return;try{db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}
function clearBlobs(){mem.clear();urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();
  if(db){try{db.transaction('p','readwrite').objectStore('p').clear()}catch(e){}}}
function getBlob(id){return new Promise(res=>{if(mem.has(id))return res(mem.get(id));if(!db)return res(null);
  try{const q=db.transaction('p').objectStore('p').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function hydrate(root){
  root.querySelectorAll('img[data-pid]').forEach(img=>{
    const id=img.dataset.pid;
    if(urls.has(id)){img.src=urls.get(id);return}
    getBlob(id).then(b=>{if(!b)return;mem.set(id,b);if(!urls.has(id))urls.set(id,URL.createObjectURL(b));img.src=urls.get(id)});
  });
}
async function compress(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
  }catch(e){return file}
}
/* ---------- galerie du téléphone ---------- */
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`};
const slug=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40);
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
/* À appeler pendant un geste : iPhone = feuille de partage (« Enregistrer l'image »), Android = téléchargement visible dans la galerie */
function toGallery(blobs,base,quiet){
  const files=blobs.map((b,i)=>new File([b],`${base}${blobs.length>1?'-'+(i+1):''}.jpg`,{type:b.type||'image/jpeg'}));
  if(IOS&&navigator.canShare&&navigator.canShare({files})){navigator.share({files}).catch(()=>{});return}
  files.forEach((f,i)=>setTimeout(()=>download(f,f.name),i*350));
  if(!quiet) toast(files.length>1?`${files.length} photos enregistrées dans la galerie`:'Photo enregistrée dans la galerie');
}
let exportFile=null,exportGen=0;
function prepareExport(){exportFile=null;const g=++exportGen;
  exportAlbum().then(f=>{if(g!==exportGen)return;exportFile=f;const b=document.querySelector('[data-export]');
    if(b){b.disabled=false;b.textContent='📤 Envoyer mon album'}}).catch(()=>{const b=document.querySelector('[data-export]');if(b)b.textContent='Erreur, fermez et réessayez'})}
let toastT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
async function albumImage(M){
  const W=1080,pad=48,colW=(W-pad*3)/2,picH=colW,capH=96,rowH=picH+capH+44;
  const cats=M.cats.filter(c=>c.photo);
  const rows=Math.ceil(cats.length/2),H=230+rows*rowH+60;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,H);
  try{await document.fonts.ready}catch(e){}
  x.fillStyle='#4A5068';x.font='700 26px "Atkinson Hyperlegible",sans-serif';x.fillText((M.ownerM?M.title.toUpperCase()+' · ':'')+fdate(M.date).toUpperCase(),pad,80,W-2*pad);
  x.fillStyle='#14183A';x.font='64px "Lilita One",sans-serif';x.fillText(M.ownerM?`L'album de ${M.ownerM.name}`:M.title,pad,150,W-2*pad);
  x.fillStyle='#2340C8';x.font='700 30px "Atkinson Hyperlegible",sans-serif';x.fillText('★'.repeat(M.stars)+(M.stars===M.total?'  Album complet !':''),pad,200);
  for(let i=0;i<cats.length;i++){
    const ct=cats[i],p=ct.photo;
    const cx=pad+(i%2)*(colW+pad),cy=230+Math.floor(i/2)*rowH;
    x.fillStyle='#F7C31C';x.fillRect(cx-14,cy-14,colW+28,picH+capH+28);
    x.fillStyle='#2340C8';x.fillRect(cx-8,cy-8,colW+16,picH+capH+16);
    x.fillStyle='#FFFFFF';x.fillRect(cx,cy,colW,picH+capH);
    const b=await getBlob(p.id);
    if(b){try{const im=await createImageBitmap(b);const k=Math.max(colW/im.width,picH/im.height),w=im.width*k,h=im.height*k;
      x.save();x.beginPath();x.rect(cx+10,cy+10,colW-20,picH-20);x.clip();x.drawImage(im,cx+10+(colW-20-w)/2,cy+10+(picH-20-h)/2,w,h);x.restore()}catch(e){}}
    x.fillStyle='#14183A';x.font='700 28px "Atkinson Hyperlegible",sans-serif';
    let t=`${ct.icon} ${ct.name}`;while(x.measureText(t).width>colW-24&&t.length>4)t=t.slice(0,-2)+'…';
    x.fillText(t,cx+12,cy+picH+30);
    const m=M.family.find(f=>f.id===p.by);if(m){x.fillStyle='#4A5068';x.font='700 24px "Atkinson Hyperlegible",sans-serif';x.fillText(`${m.icon} trouvée par ${m.name}`,cx+12,cy+picH+68)}
  }
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}
/* ---------- mise en commun entre téléphones ---------- */
const blobToB64=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(b)});
async function exportAlbum(){
  const cats=[];
  for(const c of S.cats){const photos=[];
    for(const p of c.photos){const b=await getBlob(p.id);if(b){const data=await blobToB64(b);if(data)photos.push({id:p.id,by:p.by,ts:p.ts,data})}}
    cats.push({id:c.id,icon:c.icon,name:c.name,photos})}
  let fam=null;if(S.familyPhoto){const b=await getBlob(S.familyPhoto.id);if(b)fam={id:S.familyPhoto.id,ts:S.familyPhoto.ts,data:await blobToB64(b)}}
  const out={app:'album-musee',v:1,sent:Date.now(),title:S.title,familyPhoto:fam,family:S.family.map(m=>({id:m.id,name:m.name,icon:m.icon,color:m.color})),cats};
  return new File([JSON.stringify(out)],`album-${slug(S.title)}-${stamp()}.txt`,{type:'text/plain'});
}
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function readAlbum(text){try{const A=JSON.parse(text);if(A&&A.app==='album-musee'&&Array.isArray(A.cats))return A}catch(e){}return null}
function albumSummary(A){
  const known=new Set(S.cats.flatMap(c=>c.photos.map(p=>p.id)));
  const fresh=A.cats.reduce((n,c)=>n+c.photos.filter(p=>!known.has(p.id)).length,0);
  return {fresh,total:A.cats.reduce((n,c)=>n+c.photos.length,0),cats:A.cats.filter(c=>c.photos.length).length,empty:!S.cats.some(c=>c.photos.length)};
}
async function mergeAlbum(A){
  const mine=S.cats.some(c=>c.photos.length);
  if(!mine){ // album vide : on reprend la préparation de l'autre téléphone
    S.title=A.title||S.title;
    S.family=A.family.map(m=>({id:m.id,name:m.name,icon:m.icon||'🙂',color:m.color||COLORS[0]}));
    S.cats=A.cats.map(c=>({id:c.id,icon:c.icon,name:c.name,photos:[],votes:{},winner:null}));
    S.setupDone=true;
  }
  const fam={};
  A.family.forEach(m=>{let l=member(m.id)||S.family.find(x=>norm(x.name)===norm(m.name));
    if(!l){l={id:m.id,name:m.name,icon:m.icon||'🙂',color:m.color||COLORS[S.family.length%COLORS.length]};S.family.push(l)}
    fam[m.id]=l.id});
  const known=new Set(S.cats.flatMap(c=>c.photos.map(p=>p.id)));let added=0;
  for(const c of A.cats){
    let l=cat(c.id)||S.cats.find(x=>norm(x.name)===norm(c.name));
    if(!l){if(!c.photos.length)continue;l={id:c.id,icon:c.icon,name:c.name,photos:[],votes:{},winner:null};S.cats.push(l)}
    let changed=false;
    for(const p of c.photos){if(known.has(p.id))continue;
      try{const b=await (await fetch(p.data)).blob();putBlob(p.id,b);l.photos.push({id:p.id,by:fam[p.by]||p.by,ts:p.ts||Date.now()});known.add(p.id);added++;changed=true}catch(e){}}
    if(changed){l.photos.sort((a,b)=>a.ts-b.ts);l.votes={};l.skipped={};l.winner=null;l.closed=false}
  }
  if(A.familyPhoto&&A.familyPhoto.data&&!S.familyPhoto){try{const b=await (await fetch(A.familyPhoto.data)).blob();putBlob(A.familyPhoto.id,b);S.familyPhoto={id:A.familyPhoto.id,ts:A.familyPhoto.ts};added++}catch(e){}}
  if(added)S.voteCelebrated=false;
  save();return added;
}
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const member=id=>S.family.find(m=>m.id===id);
const av=(m,cls='')=>m?`<span class="av ${cls}" style="background:${m.color}" aria-hidden="true">${esc(m.icon||m.name.trim().charAt(0).toUpperCase()||'?')}</span>`:'';
const cat=id=>S.cats.find(c=>c.id===id);
const filled=()=>S.cats.filter(c=>c.photos.length).length;
const complete=()=>S.cats.length>0&&filled()===S.cats.length;
const winnerOf=c=>c.photos.find(p=>p.id===c.winner)||(c.photos.length===1?c.photos[0]:null);
const decided=c=>!c.photos.length||!!winnerOf(c);
const coverOf=c=>winnerOf(c)||c.photos[c.photos.length-1];
const nextUndecided=()=>S.cats.find(c=>!decided(c));
/* L'album d'un membre : sa photo choisie à la main, sinon son vote, sinon sa dernière trouvaille, sinon la gagnante de la famille */
function pickFor(c,mid,picks){const ok=id=>id&&c.photos.find(p=>p.id===id);
  return ok(picks&&picks[c.id])||ok(c.votes&&c.votes[mid])||[...c.photos].reverse().find(p=>p.by===mid)||winnerOf(c)||c.photos[c.photos.length-1]||null}
function currentModel(owner){const all=S.cats.flatMap(c=>c.photos),om=owner?member(owner):null,picks=om?((S.picks||{})[owner]||{}):null;
  return {id:'',title:S.title,owner:om?owner:'',ownerM:om||null,familyPhoto:S.familyPhoto||null,date:all.length?Math.min(...all.map(p=>p.ts)):Date.now(),family:S.family,stars:filled(),total:S.cats.length,
    cats:S.cats.map(c=>{const win=winnerOf(c)||c.photos[c.photos.length-1]||null;return {key:c.id,icon:c.icon,name:c.name,photos:c.photos,photo:om?pickFor(c,owner,picks):winnerOf(c),famWin:win,excluded:((S.excl||{})[om?owner:'']||[]).includes(c.id)}})}}
function visitModel(v,owner){const om=owner?v.family.find(m=>m.id===owner):null;
  return {id:v.id,title:v.title,owner:om?owner:'',ownerM:om||null,familyPhoto:v.familyPhoto||null,date:v.date,family:v.family,stars:v.stars,total:v.total,
    cats:v.cats.map((c,i)=>{const ok=id=>id&&c.photos.find(p=>p.id===id),win=ok(c.winner)||c.photos[c.photos.length-1]||null;
      const ph=om?(ok((c.picks||{})[owner])||[...c.photos].reverse().find(p=>p.by===owner)||win):win;
      return {key:String(i),icon:c.icon,name:c.name,photos:c.photos,photo:ph,famWin:win,excluded:((v.excl||{})[om?owner:'']||[]).includes(String(i))}})}}
function archiveCurrent(){
  const all=S.cats.flatMap(c=>c.photos); if(!all.length){if(S.familyPhoto)delBlob(S.familyPhoto.id);return false}
  const filledCats=S.cats.filter(c=>c.photos.length),excl=Object.fromEntries(Object.entries(S.excl||{}).map(([o,ids])=>[o,ids.map(id=>filledCats.findIndex(c=>c.id===id)).filter(i=>i>=0).map(String)]));
  S.archive.unshift({id:uid(),excl,title:S.title,familyPhoto:S.familyPhoto||null,date:Math.min(...all.map(p=>p.ts)),stars:filled(),total:S.cats.length,
    family:S.family.map(m=>({id:m.id,name:m.name,icon:m.icon,color:m.color})),
    cats:S.cats.filter(c=>c.photos.length).map(c=>({icon:c.icon,name:c.name,photos:c.photos.map(p=>({id:p.id,by:p.by,ts:p.ts})),winner:(winnerOf(c)||coverOf(c)).id,picks:Object.fromEntries(S.family.map(m=>[m.id,(pickFor(c,m.id,(S.picks||{})[m.id])||{}).id]))}))});
  return true;
}
/* ---------- PDF : trois styles ; chaque page est dessinée sur un canvas puis insérée en JPEG ---------- */

const BLOB='M88 6c18 20 6 40 24 52s40-4 44 18-26 24-22 46 32 26 18 46-40 0-56 14-14 22-30 18c-10-28 10-46-4-66S18 120 26 96s40-18 40-42S70 22 88 6z';
const F={lil:'"Lilita One","Arial Rounded MT Bold",sans-serif',atk:'"Atkinson Hyperlegible",sans-serif',hand:'"Gochi Hand","Comic Sans MS",cursive',
  serif:'"Libre Baskerville",Georgia,serif',emo:'"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'};
function newPage(bg){const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle=bg||'#FFFFFF';x.fillRect(0,0,PW,PH);return [c,x]}
async function bitmap(id){const b=id&&await getBlob(id);if(!b)return null;try{return await createImageBitmap(b)}catch(e){return null}}
function cover(x,im,X,Y,w,h){const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;
  x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.drawImage(im,X+(w-dw)/2,Y+(h-dh)/2,dw,dh);x.restore()}
function wrap(x,text,X,Y,maxW,lh,maxLines){const words=String(text).split(' ');let line='',n=0;
  for(const w of words){const t=line?line+' '+w:w;
    if(x.measureText(t).width>maxW&&line){if(n===maxLines-1){line+='…';break}x.fillText(line,X,Y+n*lh);n++;line=w}else line=t}
  if(line){x.fillText(line,X,Y+n*lh,maxW);n++}return Y+(n-1)*lh+lh}
function fit(im,w,h){const k=Math.min(w/im.width,h/im.height);return [im.width*k,im.height*k]}
function rr(x,X,Y,w,h,r){r=(typeof r==='number'?[r,r,r,r]:r).map(v=>Math.max(0,Math.min(v,w/2,h/2)));

  x.lineTo(X+r[3],Y+h);x.quadraticCurveTo(X,Y+h,X,Y+h-r[3]);x.lineTo(X,Y+r[0]);x.quadraticCurveTo(X,Y,X+r[0],Y);x.closePath()}

function starShape(x,cx,cy,R,fill,stroke,lw,ang){x.save();x.translate(cx,cy);x.rotate(ang||0);x.beginPath();
  for(let i=0;i<10;i++){const r=i%2?R*.45:R,a=i*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();

  const inFam=om?M.cats.filter(c=>c.famWin&&c.famWin.by===om.id).length:0;

async function pdfPages(M,tpl){

async function makePDF(M,tpl){

    const jpg=new Uint8Array(await (await new Promise(r=>pages[i].toBlob(r,'image/jpeg',.85))).arrayBuffer());
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    offs[P]=len;push(`${P} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>\nendobj\n`);
    offs[C]=len;push(`${C} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[I]=len;push(`${I} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  }

  push(xr+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${x0}\n%%EOF\n`);

function ballotView(){
  const c=cat(view.id); if(!c) return voteView();
  const valid=id=>c.photos.some(p=>p.id===id);
  if(c.photos.length===1){
    return `<button class="back" data-go="vote">← Le vote</button>
      <div class="cat-head"><span class="glyph" aria-hidden="true">${esc(c.icon)}</span><h2>${esc(c.name)}</h2></div>
      <div class="vote-grid"><div class="vote-card lead"><img data-pid="${c.photos[0].id}" alt=""><span class="crown">👑</span></div></div>
      <p class="note">Une seule photo dans ce cadre : elle gagne d'office.</p>${nextBtn()}`;
  }
  const voter=S.family.find(m=>!valid(c.votes[m.id])&&!(c.skipped||{})[m.id]);
  const nVotes=S.family.filter(m=>valid(c.votes[m.id])).length;
  if(S.voteMode!=='secret'&&!c.winner&&!(c.closed&&nVotes)){
    const sk=c.skipped||{},cur=member(view.rv)&&!valid(c.votes[view.rv])&&!sk[view.rv]?view.rv:(voter?voter.id:null);
    const chips=S.family.map(m=>{const v=valid(c.votes[m.id]),k=sk[m.id];
      return `<button class="chipbtn ${m.id===cur?'on':''}" data-rvoter="${m.id}" aria-pressed="${m.id===cur}">${av(m)}<span>${esc(m.name)}<small>${v?'✓ a voté':k?'passe':m.id===cur?'à toi !':'pas encore'}</small></span></button>`}).join('');
    const tally={};c.photos.forEach(p=>tally[p.id]=[]);S.family.forEach(m=>{if(valid(c.votes[m.id]))tally[c.votes[m.id]].push(m.id)});
    const cards=c.photos.map(p=>`<button class="vote-card ${cur&&c.votes[cur]===p.id?'lead':''}" data-rballot="${p.id}" aria-label="Voter pour cette photo"><img data-pid="${p.id}" alt=""><span class="tally">${tally[p.id].map(m=>av(member(m))).join('')}</span></button>`).join('');
    const curM=member(cur);
    return `<button class="back" data-go="vote">← Le vote</button>
      <div class="cat-head"><span class="glyph" aria-hidden="true">${esc(c.icon)}</span><h2>${esc(c.name)}</h2></div>
      <div class="chips wrap">${chips}</div>
      <p style="margin:0;font-weight:700">${curM?`${esc(curM.icon)} ${esc(curM.name)}, touche ta photo préférée`:'Tout le monde a voté ! On peut encore changer d’avis en touchant un animal.'}</p>
      <div class="vote-grid">${cards}</div>
      <button class="btn big ${voter?'ghost':'coral'}" data-rdone ${nVotes?'':'disabled'}>${voter?'Terminer le vote sans les autres':'Voir le résultat'}</button>
      ${curM?`<button class="btn ghost small" data-rskip="${curM.id}">${esc(curM.name)} ne vote pas</button>`:''}`;
  }
  if(voter&&!c.winner){
    if(view.ready!==voter.id){
      const n=S.family.filter(m=>valid(c.votes[m.id])||(c.skipped||{})[m.id]).length;
      return `<button class="back" data-go="vote">← Le vote</button>
        <div class="cat-head"><span class="glyph" aria-hidden="true">${esc(c.icon)}</span><h2>${esc(c.name)}</h2></div>
        <div class="turn">${av(voter,'xl')}<div class="eyebrow">Vote ${n+1} sur ${S.family.length}</div>
          <h2>${n?'Passe le téléphone à':'C\'est au tour de'} ${esc(voter.name)}</h2>
          <button class="btn big coral" data-ready="${voter.id}">C'est moi, je vote !</button>
          ${speakBtn('turn:'+voter.id+':'+c.id)}
          ${n?'':`<span class="note">Les votes restent secrets jusqu'à la fin.</span>`}</div>`;
    }
    const cards=c.photos.map(p=>`<button class="vote-card" data-ballot="${p.id}" aria-label="Choisir cette photo"><img data-pid="${p.id}" alt=""></button>`).join('');
    return `<button class="back" data-go="vote">← Le vote</button>
      <div class="row">${av(voter,'lg')}<div><div class="eyebrow">${esc(c.icon)} ${esc(c.name)}</div><h2>${esc(voter.name)}, touche ta préférée</h2></div></div>
      <div class="vote-grid">${cards}</div>
      <button class="btn ghost small" data-skip="${voter.id}">${esc(voter.name)} ne vote pas</button>`;
  }
  // résultat
  const tally={};c.photos.forEach(p=>tally[p.id]=[]);
  S.family.forEach(m=>{if(valid(c.votes[m.id]))tally[c.votes[m.id]].push(m.id)});
  const max=Math.max(0,...Object.values(tally).map(a=>a.length));
  const leaders=c.photos.filter(p=>tally[p.id].length===max).map(p=>p.id);
  if(!c.winner&&leaders.length===1){c.winner=leaders[0];save();setTimeout(confetti,150)}
  const tie=!c.winner;
  const cards=c.photos.map(p=>{const lead=c.winner?p.id===c.winner:leaders.includes(p.id);
    return `<button class="vote-card ${lead?'lead':'lose'}" ${tie&&lead?`data-pickwin="${p.id}"`:'disabled'}>
     <img data-pid="${p.id}" alt="">${c.winner===p.id?'<span class="crown">👑</span>':''}
     <span class="tally">${tally[p.id].map(m=>av(member(m))).join('')}</span></button>`}).join('');
  const w=c.photos.find(p=>p.id===c.winner);
  return `<button class="back" data-go="vote">← Le vote</button>
    <div class="cat-head"><span class="glyph" aria-hidden="true">${esc(c.icon)}</span><h2>${esc(c.name)}</h2></div>
    <p style="margin:0;font-weight:800;font-size:1.1rem">${tie?'Égalité ! Un parent touche la photo qui gagne.':
      `C'est choisi ! ${w&&member(w.by)?`Photo trouvée par ${esc(member(w.by).name)} ${esc(member(w.by).icon)}`:''}`}</p>
    <div class="vote-grid">${cards}</div>
    ${tie?'':nextBtn()}
    <button class="btn ghost small" data-revote="${c.id}">Revoter</button>`;
}

function backupBlock(){
  const n=S.archive.length,since=n-(S.backupCount||0),key='backup:';
  const status=!S.lastBackup?(n?`<strong style="color:var(--coral)">Jamais sauvegardé.</strong>`:'Aucune sauvegarde pour l’instant.')
    :since>0?`<strong style="color:var(--coral)">${since} visite${since>1?'s':''} pas encore sauvegardée${since>1?'s':''}.</strong> Dernière sauvegarde : ${fdate(S.lastBackup)}.`
    :`<span style="color:var(--ok);font-weight:800">✓ À jour</span> · dernière sauvegarde : ${fdate(S.lastBackup)}.`;
  const btn=ready&&ready.key===key?`<button class="btn big coral" data-sharenow>📤 Envoyer la sauvegarde</button>`
    :busy===key?`<button class="btn big" disabled>Préparation…</button>`
    :`<button class="btn big ${n?'':'ghost'}" data-make="backup" data-v="" ${n?'':'disabled'}>💾 Sauvegarder tout le carnet</button>`;

  u.lang='fr-FR';const v=frVoice();if(v)u.voice=v;u.rate=.92;u.pitch=1.05;

  const bar=barHTML();$('#bar').innerHTML=bar;$('#bar').hidden=!bar;document.body.classList.toggle('has-bar',!!bar);
  $('#sheet').innerHTML=sheetHTML();
  hydrate(document.body);popId=null;updateWake();
}
/* ---------- confettis ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#E2B550','#E0533E','#2E6FB7','#2F8F5B','#8A4FBF'];
  const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,s:5+Math.random()*6,c:cols[Math.random()*5|0]}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<200) requestAnimationFrame(f); else cv.hidden=true})();
}
function endCapture(){if(pending&&pending.url)URL.revokeObjectURL(pending.url);pending=null;sheet=null}
/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const zi=e.target.closest('[data-zoom]');
  if(zi){const z=document.createElement('div');z.className='zoomed';z.innerHTML=`<img src="${zi.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z);return}
  const sh=e.target.closest('[data-backdrop]');
  if(sh&&e.target===sh){sheet=null;confirmKey=null;return render()}
  const t=e.target.closest('button'); if(!t||t.disabled) return;
  const d=t.dataset;
  if(d.introstep){if(d.introstep==='done'){S.onboarded=true;save();return go({name:S.setupDone?'welcome':'setup'})}view.step=+d.introstep;return render()}
  if(d.tab){const t=d.tab;if(t==='album'&&!S.setupDone)return go({name:'setup'});return go({name:t==='album'?'home':t==='hunt'?(view.name==='hunts'?'hunts':(S.lastHunt?'hunt':'hunts')):t,id:t==='hunt'?S.lastHunt:undefined})}
  if(d.go){if(d.go==='final'&&!S.voteCelebrated){S.voteCelebrated=true;save();setTimeout(confetti,200)} return go({name:d.go})}
  if(d.start!==undefined){S.family.forEach((m,i)=>{if(!m.name.trim())m.name='Invité '+(i+1)});S.cats.forEach(c=>{if(!c.name.trim())c.name='Cadre surprise'});S.setupDone=true;save();return go({name:'home'})}
  if(d.open) return go({name:'cat',id:d.open});
  if(d.photo){sheet={type:'photo',cat:view.id,id:d.photo};confirmKey=null;return render()}
  if(d.close!==undefined){sheet=null;confirmKey=null;return render()}
  if(d.photomode!==undefined){sheet.mode=d.photomode||undefined;confirmKey=null;return render()}
  if(d.movecat){const c=cat(sheet.cat),t=cat(d.movecat),p=c&&c.photos.find(x=>x.id===sheet.id);if(!p||!t)return;
    const wasEmpty=!t.photos.length,wasComplete=complete();
    c.photos=c.photos.filter(x=>x.id!==p.id);t.photos.push(p);t.photos.sort((a,b)=>a.ts-b.ts);
    [c,t].forEach(x=>{x.votes={};x.skipped={};x.winner=null;x.closed=false});S.voteCelebrated=false;if(!complete())S.celebrated=false;
    if(!wasComplete&&complete()&&!S.celebrated){S.celebrated=true;setTimeout(confetti,300)}
    save();sheet=null;toast(`Déplacée dans ${t.icon}${wasEmpty?' : nouvelle étoile !':''}`);return render()}
  if(d.setwho){const c=cat(sheet.cat),p=c&&c.photos.find(x=>x.id===sheet.id);if(p){p.by=d.setwho;save();toast(`Trouvée par ${member(d.setwho).name}`)}sheet.mode=undefined;return render()}
  if(d.delphoto){
    if(confirmKey!=='ph'+d.delphoto){confirmKey='ph'+d.delphoto;return render()}
    const c=cat(view.id);c.photos=c.photos.filter(p=>p.id!==d.delphoto);c.votes={};c.skipped={};c.winner=null;c.closed=false;delBlob(d.delphoto);
    S.voteCelebrated=false;if(!complete())S.celebrated=false;save();sheet=null;confirmKey=null;return render();
  }
  if(d.savephoto){const id=d.savephoto;getBlob(id).then(b=>{if(b)toGallery([b],`${slug(S.title)}-${stamp()}`)});return}
  /* capture : cadre puis personne */
  if(d.capcat){sheet.cat=d.capcat;return render()}
  if(d.capback!==undefined){sheet.cat=null;return render()}
  if(d.cancelcap!==undefined){endCapture();return render()}
  if(d.who){
    const c=cat(sheet.cat),f=pending.file,wasFilled=c.photos.length>0,wasComplete=complete();
    if(S.gallery) toGallery([f],`${slug(S.title)}-${slug(c.name)}-${stamp()}`,true);
    endCapture();
    S.lastActive=Date.now();
    if(view.name!=='cat'&&view.name!=='home')view={name:'home'};
    const id=uid();c.photos.push({id,by:d.who,ts:Date.now()});c.votes={};c.skipped={};c.winner=null;c.closed=false;S.voteCelebrated=false;save();
    compress(f).then(b=>{putBlob(id,b);render()});
    if(!wasFilled) popId=c.id;
    toast(wasFilled?`Rangée dans ${c.icon}`:`Nouvelle étoile ! ${c.icon}`);
    if(!wasComplete&&complete()&&!S.celebrated){S.celebrated=true;save();setTimeout(confetti,300)}
    return render();
  }
  if(d.speak){speak(speechFor(d.speak),d.speak);return}
  if(d.newvisit!==undefined||d.reset!==undefined){sheet={type:'newvisit'};confirmKey=null;return render()}
  if(d.newv){
    if(d.newv==='wipe'&&confirmKey!=='wipe'){confirmKey='wipe';return render()}
    if(d.newv==='keep'){archiveCurrent();toast('Album rangé dans le carnet 📖')}
    else{S.cats.forEach(c=>c.photos.forEach(p=>delBlob(p.id)));if(S.familyPhoto)delBlob(S.familyPhoto.id);if(d.newv==='wipe')toast('Album effacé')}
    const keep=S;S=freshState(keep);S.setupDone=false;S.onboarded=true;S.lastActive=0;save();return go({name:'setup'});
  }
  if(d.resethunt){if(confirmKey!=='hunt'){confirmKey='hunt';return render()}
    const st=hstate(d.resethunt);Object.values(st.found).forEach(f=>delBlob(f.id));S.hunts[d.resethunt]={found:{},ticks:{},hints:{}};confirmKey=null;save();toast('Jeu remis à zéro');return render()}
  if(d.owner!==undefined){view.owner=d.owner;ready=null;busy=null;confirmKey=null;return render()}
  if(d.excl!==undefined){const own=view.owner||'',V=view.name==='visit'?S.archive.find(x=>x.id===view.id):null,box=V?(V.excl=V.excl||{}):(S.excl=S.excl||{}),arr=box[own]=box[own]||[];
    const i=arr.indexOf(d.excl);if(i>=0)arr.splice(i,1);else arr.push(d.excl);save();ready=null;busy=null;return render()}
  if(d.tpl){S.pdfTpl=d.tpl;save();ready=null;busy=null;return render()}
  if(d.repick!==undefined){sheet={type:'repick',key:d.repick};return render()}
  if(d.setpick){const own=view.owner;if(!own)return;
    if(view.name==='visit'){const v=S.archive.find(x=>x.id===view.id),c=v&&v.cats[+sheet.key];if(c){c.picks=c.picks||{};c.picks[own]=d.setpick}}
    else{S.picks=S.picks||{};(S.picks[own]=S.picks[own]||{})[sheet.key]=d.setpick}
    save();sheet=null;ready=null;busy=null;toast('Photo changée');return render()}
  /* jeu de piste */
  if(d.hunt){S.lastHunt=d.hunt;save();return go({name:'hunt',id:d.hunt})}
  if(d.clue){return go({name:'clue',hunt:view.hunt||view.id,id:d.clue})}
  if(d.hint!==undefined){hstate(view.hunt).hints[view.id]=1;save();return render()}
  if(d.huntwho){
    const h=huntOf(view.hunt),c=h.cards.find(x=>x.id===view.id),st=hstate(h.id),f=pending.file,old=st.found[c.id];
    if(S.gallery) toGallery([f],`jeu-${slug(h.title)}-${slug(c.title)}-${stamp()}`,true);
    endCapture();const id=uid();st.found[c.id]={id,by:d.huntwho,ts:Date.now()};save();
    compress(f).then(b=>{putBlob(id,b);if(old)delBlob(old.id);render()});
    const n=Object.keys(st.found).length;
    toast(old?'Photo remplacée':`Nouvelle étoile ! ${c.icon}`);
    if(!old&&n===h.cards.length)setTimeout(confetti,300);
    return render();
  }
  /* vote */
  if(d.visit) return go({name:'visit',id:d.visit});
  if(d.tocarnet!==undefined){
    if(confirmKey!=='carnet'){confirmKey='carnet';return render()}
    archiveCurrent();const keep=S;S=freshState(keep);S.setupDone=true;save();toast('Album rangé dans le carnet 📖 Pensez à le sauvegarder');return go({name:'carnet'})}
  if(d.delvisit){
    if(confirmKey!=='del'+d.delvisit){confirmKey='del'+d.delvisit;return render()}
    const v=S.archive.find(x=>x.id===d.delvisit);if(v){v.cats.forEach(c=>c.photos.forEach(p=>delBlob(p.id)));if(v.familyPhoto)delBlob(v.familyPhoto.id)}
    S.archive=S.archive.filter(x=>x.id!==d.delvisit);save();return go({name:'carnet'})}
  if(d.sharesheet!==undefined){sheet={type:'share'};prepareExport();return render()}
  if(d.export!==undefined){
    const f=exportFile; if(!f) return;
    const fallback=()=>{download(f,f.name);toast("Fichier enregistré dans Téléchargements : envoie-le à l'autre téléphone")};
    // appelé tout de suite dans le geste, sinon le téléphone bloque le partage
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).catch(err=>{if(!err||err.name!=='AbortError')fallback()});
    } else fallback();
    return}
  if(d.doimport!==undefined){const A=sheet.album;t.disabled=true;t.textContent='Ajout…';
    mergeAlbum(A).then(n=>{sheet=null;toast(n?`${n} photo${n>1?'s':''} ajoutée${n>1?'s':''} !`:'Préparation reprise');go({name:'home'})});return}
  if(d.vote) return go({name:'ballot',id:d.vote});
  if(d.ready){view.ready=d.ready;return render()}
  if(d.votemode){S.voteMode=d.votemode;save();return render()}
  if(d.rvoter){view.rv=d.rvoter;const c=cat(view.id);if(c&&c.skipped)delete c.skipped[d.rvoter];save();return render()}
  if(d.rballot||d.rskip){const c=cat(view.id),sk=c.skipped=c.skipped||{},valid=id=>c.photos.some(p=>p.id===id);
    const who=d.rskip||(member(view.rv)&&!sk[view.rv]?view.rv:(S.family.find(m=>!valid(c.votes[m.id])&&!sk[m.id])||{}).id);if(!who)return;
    if(d.rskip){delete c.votes[who];sk[who]=1}else{c.votes[who]=d.rballot;delete sk[who]}
    const i=S.family.findIndex(m=>m.id===who),order=[...S.family.slice(i+1),...S.family.slice(0,i)];
    view.rv=(order.find(m=>!valid(c.votes[m.id])&&!sk[m.id])||{}).id||null;save();return render()}
  if(d.rdone!==undefined){const c=cat(view.id),sk=c.skipped=c.skipped||{},valid=id=>c.photos.some(p=>p.id===id);
    S.family.forEach(m=>{if(!valid(c.votes[m.id]))sk[m.id]=1});c.closed=true;view.rv=null;save();window.scrollTo(0,0);return render()}
  if(d.ballot){const c=cat(view.id),v=S.family.find(m=>!c.photos.some(p=>p.id===c.votes[m.id])&&!(c.skipped||{})[m.id]);
    if(v){c.votes[v.id]=d.ballot;save()} view.ready=null;window.scrollTo(0,0);return render()}
  if(d.skip){const c=cat(view.id);delete c.votes[d.skip];c.skipped=Object.assign(c.skipped||{},{[d.skip]:1});save();view.ready=null;return render()}
  if(d.pickwin){const c=cat(view.id);c.winner=d.pickwin;save();setTimeout(confetti,150);return render()}
  if(d.revote){const c=cat(d.revote);c.votes={};c.skipped={};c.winner=null;c.closed=false;view.rv=null;S.voteCelebrated=false;save();view.ready=null;return render()}
  if(d.make){const key=exportKey(d.make,d.v);busy=key;ready=null;render();
    buildFiles(d.make,d.v,view.owner||'').then(files=>{busy=null;ready=files.length?{key,files}:null;if(!files.length)toast('Aucune photo à enregistrer');render()})
      .catch(()=>{busy=null;toast('La préparation a échoué, réessayez');render()});return}
  if(d.sharenow!==undefined&&ready){shareFiles(ready.files);if(ready.key==='backup:'){toast('Choisissez Drive ou votre mail pour la garder en lieu sûr')}return}
  if(d.dorestore!==undefined){t.disabled=true;t.textContent='Restauration…';
    restoreBackup(sheet.backup).then(r=>{sheet=null;toast(`${r.visits} visite${r.visits>1?'s':''} ajoutée${r.visits>1?'s':''} au carnet`);go({name:'carnet'})});return}
  if(d.install!==undefined&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()});return}
  /* préparation */
  if(d.pickfam){sheet={type:'icon',kind:'fam',id:d.pickfam};return render()}
  if(d.pickcat){sheet={type:'icon',kind:'cat',id:d.pickcat};return render()}
  if(d.seticon){const o=sheet.kind==='fam'?member(sheet.id):cat(sheet.id);o.icon=d.seticon;save();if(sheet.kind==='cat')sheet=null;return render()}
  if(d.setcolor){member(sheet.id).color=d.setcolor;save();return render()}
  if(d.addfam!==undefined){const k=S.family.length;S.family.push({id:uid(),name:'',icon:ANIMALS[(k+4)%ANIMALS.length],color:COLORS[k%COLORS.length]});save();render();
    const inp=$('#fam-'+S.family[k].id);inp&&inp.focus();return}
  if(d.delfam){S.family=S.family.filter(m=>m.id!==d.delfam);S.cats.forEach(c=>{delete c.votes[d.delfam]});save();return render()}
  if(d.addcat!==undefined){const c={id:uid(),icon:'✨',name:'',photos:[],votes:{},winner:null};S.cats.push(c);S.celebrated=false;save();render();
    const inp=$('#cat-'+c.id);inp&&inp.focus();return}
  if(d.delcat){const c=cat(d.delcat);
    if(c.photos.length&&confirmKey!=='cat'+c.id){confirmKey='cat'+c.id;return render()}
    c.photos.forEach(p=>delBlob(p.id));S.cats=S.cats.filter(x=>x.id!==c.id);confirmKey=null;save();return render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='gal'){S.gallery=e.target.checked;save();return}
  if(e.target.id==='awake'){S.keepAwake=e.target.checked;save();updateWake();return}
  if(e.target.dataset&&e.target.dataset.tick!==undefined&&view.name==='clue'){const st=hstate(view.hunt),i=+e.target.dataset.tick,a=st.ticks[view.id]=st.ticks[view.id]||[];
    if(e.target.checked){if(!a.includes(i))a.push(i)}else st.ticks[view.id]=a.filter(x=>x!==i);save();return}
  if((e.target.id==='huntcam'||e.target.id==='huntcam2')&&e.target.files[0]){const f=e.target.files[0];e.target.value='';
    pending={file:f,url:URL.createObjectURL(f)};sheet={type:'huntwho'};render();return}
  if(e.target.id==='famcam'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';
    if(S.gallery) toGallery([f],`${slug(S.title)}-famille-${stamp()}`,true);
    const old=S.familyPhoto,id=uid();S.familyPhoto={id,ts:Date.now()};save();
    compress(f).then(b=>{putBlob(id,b);if(old)delBlob(old.id);ready=null;render();toast('Photo de famille ajoutée 📸')});return}
  if(e.target.id==='restorefile'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';toast('Lecture de la sauvegarde…');
    f.text().then(txt=>{const B=readBackup(txt);if(!B){toast(readAlbum(txt)?"C'est un album à mettre en commun, pas une sauvegarde : utilisez « Recevoir un album »":"Ce fichier n'est pas une sauvegarde du carnet");return}
      sheet={type:'restore',backup:B};render()});return}
  if(e.target.id==='importfile'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';
    f.text().then(txt=>{const A=readAlbum(txt);if(!A){toast("Ce fichier n'est pas un album du musée");return}sheet={type:'import',album:A};render()});return}
  if(e.target.id==='cam'&&e.target.files[0]){
    const f=e.target.files[0];e.target.value='';
    pending={file:f,url:URL.createObjectURL(f)};
    sheet={type:'capture',cat:view.name==='cat'?view.id:null};render();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='title') S.title=t.value.trim()?t.value:'Notre musée';
  else if(d.fam){member(d.fam).name=t.value}
  else if(d.catname){cat(d.catname).name=t.value}
  else return;
  save();
});
render();
if(/[?&]shared=1/.test(location.search)&&'caches' in window){
  history.replaceState(null,'',location.pathname);
  caches.open('share').then(c=>c.match('shared-album').then(r=>{if(!r)return;c.delete('shared-album');
    r.text().then(txt=>{const A=readAlbum(txt);if(A){sheet={type:'import',album:A};render()}else toast("Ce fichier n'est pas un album du musée")})}));
}
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
